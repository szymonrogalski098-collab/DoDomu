<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DoDomu</title>
  <style>
    :root {
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --color-bg: #ffffff;
      --color-text: #1a1a1a;
      --color-muted: #6b6b6b;
      --color-border: #d0d0d0;
      --color-primary: #1a1a1a;
      --color-primary-text: #ffffff;
      --color-error: #b3261e;
      --touch-min: 44px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
    }

    [hidden] {
      display: none !important;
    }

    .view {
      max-width: 375px;
      margin: 0 auto;
      padding: var(--space-6) var(--space-4);
      min-height: 100vh;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 var(--space-6) 0;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 var(--space-2) 0;
    }

    p {
      margin: 0 0 var(--space-4) 0;
      color: var(--color-muted);
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: var(--space-1);
    }

    .field {
      margin-bottom: var(--space-4);
    }

    input {
      width: 100%;
      height: var(--touch-min);
      padding: 0 var(--space-3);
      font-size: 16px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-bg);
      color: var(--color-text);
    }

    input:focus {
      outline: 2px solid var(--color-text);
      outline-offset: 1px;
    }

    button {
      width: 100%;
      min-height: var(--touch-min);
      padding: 0 var(--space-4);
      font-size: 16px;
      border: 1px solid var(--color-primary);
      border-radius: 4px;
      background: var(--color-primary);
      color: var(--color-primary-text);
      cursor: pointer;
      margin-bottom: var(--space-2);
    }

    button.secondary {
      background: var(--color-bg);
      color: var(--color-primary);
    }

    button:active {
      opacity: 0.85;
    }

    .error {
      color: var(--color-error);
      font-size: 14px;
      min-height: var(--space-4);
      margin: var(--space-2) 0 0 0;
    }
  </style>
</head>
<body>

  <div id="view-auth" class="view" hidden>
    <h1>DoDomu</h1>
    <form id="auth-form">
      <div class="field">
        <label for="auth-email">E-mail</label>
        <input id="auth-email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="auth-password">Hasło</label>
        <input id="auth-password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button id="btn-login" type="submit">Zaloguj</button>
      <button id="btn-register" type="button" class="secondary">Zarejestruj</button>
      <p id="auth-error" class="error"></p>
    </form>
  </div>

  <div id="view-pending" class="view" hidden>
    <h2>Czekasz na zatwierdzenie</h2>
    <p>Szymon musi potwierdzić Twoje konto.</p>
    <button id="btn-logout" type="button">Wyloguj</button>
  </div>

  <div id="view-app" class="view" hidden>
    <!-- tu trafi lista produktów -->
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
